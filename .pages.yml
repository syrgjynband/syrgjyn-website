
media:
  input: images
  output: /images

content:
  - name: band
    label: Band Information
    type: file
    path: _data/band.json
    format: json
    fields:
      - name: shortBio
        label: Short Press Biography
        type: text
        required: true
      - name: members
        label: Current Lineup
        type: object
        list: true
        fields:
          - name: name
            label: Member Name
            type: string
            required: true
          - name: role
            label: Instrument / Role
            type: string
            required: true

  - name: shows
    label: Shows & Live History
    type: file
    path: _data/shows.json
    format: json
    fields:
      - name: events
        label: Confirmed Shows
        type: object
        list: true
        fields:
          - name: date
            label: Date (YYYY-MM-DD)
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: title
            label: Event / Festival
            type: string
            required: true
          - name: city
            label: City
            type: string
            required: true
          - name: venue
            label: Venue
            type: string
          - name: details
            label: Doors / Additional Information
            type: text
      - name: history
        label: Live History Summary
        type: text

  - name: chronicles
    label: The Chronicles
    type: collection
    path: content/posts
    fields:
      - name: title
        label: Article Title
        type: string
        required: true

      - name: date
        label: Publication Date
        type: date

      - name: category
        label: Category
        type: select
        options:
          values:
            - Band News
            - Underground History
            - Music & Releases
            - The Syrgjyn Codex

      - name: description
        label: Short Description
        type: text

      - name: cover
        label: Cover Image
        type: image

      - name: coverAlt
        label: Cover Image Description
        type: string

      - name: author
        label: Author
        type: string

      - name: body
        label: Article Content
        type: rich-text

    view:
      fields: [title, date, category]
      primary: title
      default:
        sort: date
        order: desc
